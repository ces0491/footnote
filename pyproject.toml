[project]
name = "footnote"
version = "0.1.0"
description = "Explained match intelligence from synthetic football events"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core>=1.22.0",
    "agent-framework-foundry>=1.15.0",
    "aiohttp>=3.14.5",
    "azure-eventhub>=5.15.1",
    "azure-eventhub-checkpointstoreblob-aio>=1.2.0",
    "azure-identity>=1.26.0",
    "azure-messaging-webpubsubservice>=1.3.0",
    "azure-monitor-opentelemetry>=1.8",
    "certifi>=2026.10.18",
    "fastapi>=0.148.0",
    # Agent Framework 1.22's MCP client reads MCP 1's field names, so MCP 2 breaks the match tools.
    "mcp>=1.30.0,<2",
    "numpy>=2.4.6",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footnote"]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "scipy>=1.17.1",
]
evals = [
    "azure-ai-evaluation>=1.18.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: generates many matches; excluded from the default run with -m 'not slow'",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["/data", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
