name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    # For tests/test_store.py: the SQL against a real Postgres, the version the Azure server runs.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres  # a throwaway container's, nothing else uses it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FOOTNOTE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes full version tags only (no moving v10 tag).
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Includes the showcase replay, which checks that the committed showcase files are what the
      # recipe produces on this machine's hardware.
      - run: uv run pytest -m "not slow"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: az bicep install --version v0.48.1
      - name: Build and lint the Bicep
        run: |
          for file in infra/*.bicep infra/modules/*.bicep; do
            az bicep build --file "$file" --stdout > /dev/null
            az bicep lint --file "$file"
          done
