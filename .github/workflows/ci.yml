name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes full version tags only (no moving v10 tag).
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Includes the showcase replay, which checks that the committed showcase files are what the
      # recipe produces on this machine's hardware.
      - run: uv run pytest -m "not slow"
